name: Pruebas y despliegue en Railway

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar pruebas de suma
        run: python -m pytest tests/test_suma_lista.py -v

      - name: Comprobar página Flask
        run: |
          python - <<'PY'
          from app import app

          cliente = app.test_client()
          assert cliente.get("/").status_code == 200

          respuesta = cliente.post(
              "/", data={"numeros": "10,20,-5,2.5"}
          )
          assert respuesta.status_code == 200
          assert b"27.5" in respuesta.data
          print("Página Flask y suma comprobadas")
          PY

      - name: Solicitar despliegue en Render
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --max-time 30 \
            --output /dev/null \
            "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"
          echo "Despliegue solicitado a Render"
